				.replace(/"/g, "&quot;")

			try {

					return parsed.href;
				}
			} catch (_) {}
			return "#";
		}

		async function copyTextToClipboard(text) {
			try {
				if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
					await navigator.clipboard.writeText(text);
					return true;
				}
			} catch (_) {}

			try {
				const textarea = document.createElement("textarea");
				textarea.value = text;
				textarea.setAttribute("readonly", "");
				textarea.style.position = "fixed";
				textarea.style.opacity = "0";
				document.body.appendChild(textarea);
				textarea.select();
				const ok = document.execCommand("copy");
				document.body.removeChild(textarea);
				return ok;
			} catch (_) {
				return false;
			}
		}

				const inUrl = (bookmark.url || "").toLowerCase().includes(normalizedQ);
				const inDesc = (bookmark.description || "").toLowerCase().includes(normalizedQ);

			setMetaContent('meta[property="og:title"]', title);
			setMetaContent('meta[property="og:description"]', description);
			setMetaContent('meta[name="twitter:title"]', title);
			setMetaContent('meta[name="twitter:description"]', description);

			if (!window.location || window.location.protocol === "file:" || !window.history || typeof window.history.replaceState !== "function") {
				return;
			}
			try {
				const url = new URL(window.location.href);
				if (state.activeCollectionId && state.activeCollectionId !== "all") {
					url.searchParams.set("collection", state.activeCollectionId);
				} else {
					url.searchParams.delete("collection");
				}
				if (state.searchQuery.trim()) {
					url.searchParams.set("q", state.searchQuery.trim());
				} else {
					url.searchParams.delete("q");
				}
				if (state.activeTag) {
					url.searchParams.set("tag", state.activeTag);
				} else {
					url.searchParams.delete("tag");
				}
				window.history.replaceState(null, "", url.pathname + url.search + url.hash);

				const canonicalEl = document.querySelector('link[rel="canonical"]');
				if (canonicalEl) {
					const baseCanonical = canonicalEl.getAttribute("href") || url.origin + url.pathname;
					try {
						const canonUrl = new URL(baseCanonical);
						canonUrl.search = url.search;
						canonicalEl.setAttribute("href", canonUrl.toString());
						setMetaContent('meta[property="og:url"]', canonUrl.toString());
					} catch (_) {}
				}
			} catch (_) {}
		}

		function applyInitialUrlParams() {
			try {
				const savedView = localStorage.getItem("jokerx04_bm_view");
				if (savedView === "grid" || savedView === "list") {
					state.viewMode = savedView;
				}
			} catch (_) {}

			try {
				if (!window.location || !window.location.search) return;
				const params = new URLSearchParams(window.location.search);
				const col = params.get("collection");
				const q = params.get("q");
				const tag = params.get("tag");

				if (col && state.collections.some((c) => c.collectionId === col)) {
					state.activeCollectionId = col;
				}
				if (q) {
					state.searchQuery = q;
					dom.searchInput.value = q;

				if (tag) {
					state.activeTag = tag;
				}
			} catch (_) {}
		}

			const activeMobileTab = dom.mobileTabs.querySelector(`[data-collection-id="${CSS.escape(collectionId)}"]`);

			if (shouldScrollTop) {
				if (window.innerWidth >= 1024 && dom.bookmarkScrollArea) {
					dom.bookmarkScrollArea.scrollTo({ top: 0, behavior: "smooth" });
				} else {
					window.scrollTo({ top: 0, behavior: "smooth" });

		// ==================== 이벤트 바인딩 ====================

			const navBtn = e.target.closest(".bm-nav-btn, .bm-section-jump");
			if (navBtn) {
				const colId = navBtn.getAttribute("data-collection-id");
				if (colId) {
					selectCollection(colId);

			// 2. 북마크 URL 복사 버튼 클릭
			const copyBtn = e.target.closest(".bm-copy-btn");
			if (copyBtn) {
				e.preventDefault();
				e.stopPropagation();
				const url = copyBtn.getAttribute("data-copy-url");
				if (!url) return;
				const ok = await copyTextToClipboard(url);
				if (ok) {
					const labelEl = copyBtn.querySelector(".bm-copy-label");
					const iconEl = copyBtn.querySelector(".bm-copy-icon");
					copyBtn.classList.add("!bg-emerald-500/20", "!border-emerald-500/50", "!text-emerald-300");
					if (labelEl) labelEl.textContent = "복사됨";
					if (iconEl) iconEl.innerHTML = '<polyline points="20 6 9 17 4 12"></polyline>';
					showToast(`URL이 복사되었습니다: ${url}`);

					clearTimeout(copyBtn._timer);
					copyBtn._timer = setTimeout(() => {
						copyBtn.classList.remove("!bg-emerald-500/20", "!border-emerald-500/50", "!text-emerald-300");
						if (labelEl) labelEl.textContent = "복사";
						if (iconEl) {
							iconEl.innerHTML =
								'<rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>';
						}
					}, 1800);
				} else {
					showToast("클립보드 복사에 실패했습니다.");
				}
				return;
			}

			// 3. 태그 칩 클릭 -> 태그 필터 토글
			const tagBtn = e.target.closest(".bm-tag-btn");
			if (tagBtn) {
				e.preventDefault();
				e.stopPropagation();
				const tag = tagBtn.getAttribute("data-tag") || "";
				if (state.activeTag.toLowerCase() === tag.toLowerCase()) {
					state.activeTag = "";
				} else {
					state.activeTag = tag;
					showToast(`#${tag} 태그로 필터링합니다.`);
				}
				renderBookmarks();
				syncUrlParams();
				return;
			}

			// 4. 패밀리 사이트 외부 클릭 시 닫기
			if (dom.familySiteMenu && !dom.familySiteMenu.contains(e.target)) {
				setFamilyMenuOpen(false);
			}
		});

		dom.searchInput.addEventListener("input", (e) => {
			state.searchQuery = e.target.value;
			renderBookmarks();
			syncUrlParams();
		});

		dom.btnClearSearch.addEventListener("click", () => {
			state.searchQuery = "";
			dom.searchInput.value = "";
			dom.searchInput.focus();
			renderBookmarks();
			syncUrlParams();
		});

		dom.btnClearTag.addEventListener("click", () => {
			state.activeTag = "";
			renderBookmarks();
			syncUrlParams();
		});

		dom.btnResetFilters.addEventListener("click", resetAllFilters);

		dom.btnViewGrid.addEventListener("click", () => {
			if (state.viewMode === "grid") return;
			state.viewMode = "grid";
			try { localStorage.setItem("jokerx04_bm_view", "grid"); } catch (_) {}
			syncViewModeUI();
			renderBookmarks();
		});

		dom.btnViewList.addEventListener("click", () => {
			if (state.viewMode === "list") return;
			state.viewMode = "list";
			try { localStorage.setItem("jokerx04_bm_view", "list"); } catch (_) {}
			syncViewModeUI();
			renderBookmarks();
		});

		// 모바일 탭 좌우 스크롤
		dom.btnTabsLeft.addEventListener("click", () => {
			dom.mobileTabs.scrollBy({ left: -220, behavior: "smooth" });
		});
		dom.btnTabsRight.addEventListener("click", () => {
			dom.mobileTabs.scrollBy({ left: 220, behavior: "smooth" });
		});
		dom.mobileTabs.addEventListener("scroll", updateMobileTabScrollButtons);
		window.addEventListener("resize", updateMobileTabScrollButtons);

		// 패밀리 사이트 드롭업 메뉴
		function setFamilyMenuOpen(isOpen) {
			if (!dom.familySiteDropdown || !dom.btnFamilySite) return;
			dom.familySiteDropdown.classList.toggle("hidden", !isOpen);
			dom.btnFamilySite.setAttribute("aria-expanded", String(isOpen));
			if (dom.iconFamilyChevron) {
				dom.iconFamilyChevron.classList.toggle("rotate-180", isOpen);
			}
		}

		dom.btnFamilySite.addEventListener("click", (e) => {
			e.stopPropagation();
			const isCurrentlyOpen = !dom.familySiteDropdown.classList.contains("hidden");
			setFamilyMenuOpen(!isCurrentlyOpen);
		});

		// 연락처 복사
		let contactCopyTimer = null;
		dom.btnCopyContact.addEventListener("click", async () => {
			const email = "contact@jokerx04.com";
			const copied = await copyTextToClipboard(email);
			if (copied) {
				dom.iconCopyContact.classList.add("hidden");
				dom.iconCopiedContact.classList.remove("hidden");
				clearTimeout(contactCopyTimer);
				contactCopyTimer = setTimeout(() => {
					dom.iconCopyContact.classList.remove("hidden");
					dom.iconCopiedContact.classList.add("hidden");
				}, 1800);
				showToast(`이메일 주소(${email})가 복사되었습니다.`);
			} else {
				showToast(`문의 메일: ${email}`);
			}
		});

		// 키보드 단축키 (/ 검색 포커스, Esc 닫기/초기화)
		window.addEventListener("keydown", (e) => {
			if (e.key === "Escape") {
				if (dom.familySiteDropdown && !dom.familySiteDropdown.classList.contains("hidden")) {
					setFamilyMenuOpen(false);
					return;
				}
				if (document.activeElement === dom.searchInput) {
					if (state.searchQuery) {
						state.searchQuery = "";
						dom.searchInput.value = "";
						renderBookmarks();
						syncUrlParams();
					} else {
						dom.searchInput.blur();
					}
				}
				return;
			}
			if (e.key === "/" && !["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) {
				e.preventDefault();
				dom.searchInput.focus();
				dom.searchInput.select();
			}
		});

		// ==================== 초기 데이터 로드 ====================
		async function initApp() {
			showLoadingOverlay();
			try {
				const res = await fetch(JSON_URL, { cache: "no-cache" });
				if (!res.ok) {
					throw new Error(`HTTP ${res.status} (${res.statusText})`);
				}
				const data = await res.json();
				if (!Array.isArray(data)) {
					throw new Error("유효한 북마크 JSON 배열 형식이 아닙니다.");
				}
				state.collections = data;
				applyInitialUrlParams();
				syncViewModeUI();
				renderNavigation();
				renderBookmarks();
				syncUrlParams();
				requestAnimationFrame(() => {
					hideLoadingOverlay();
					updateMobileTabScrollButtons();
				});
			} catch (err) {
				console.error("Failed to load bookmark data:", err);
				showLoadError(err);
			}
		}

		if (document.readyState === "loading") {
			document.addEventListener("DOMContentLoaded", initApp);
		} else {
			initApp();
		}
	</script>
</body>
</html>
